name: Enterprise Lab PowerShell

on:
  push:
    paths:
      - 'enterprise-lab/scripts/**'
      - '.github/workflows/enterprise-lab-powershell.yml'
  pull_request:
    paths:
      - 'enterprise-lab/scripts/**'
      - '.github/workflows/enterprise-lab-powershell.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $results = @(
            Invoke-ScriptAnalyzer \
              -Path ./enterprise-lab/scripts \
              -Recurse \
              -Severity Error,Warning \
              -ExcludeRule PSUseBOMForUnicodeEncodedFile
          )
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
          Write-Output 'PSScriptAnalyzer: no errors or warnings.'
